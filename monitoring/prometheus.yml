global:
  scrape_interval: 15s  # Scrape metrics every 15 seconds

scrape_configs:
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']
    metrics_path: '/metrics' 

  - job_name: 'node-backend'
    static_configs:
      - targets: ['backend:3001']
    metrics_path: '/metrics'