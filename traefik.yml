api:
  dashboard: true
  insecure: true  # Fine for development

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: lut-cloud-course_app_internal

metrics:
  prometheus: {}
  
log:
  level: INFO