services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lut-backend
    env_file:
      - ./backend/.env
    environment:
      RUN_PORT: 3001
      CLIENT_URL: http://localhost:8080
      ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5173
      TRUST_PROXY: "true"
      NODE_ENV: production
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lut-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_internal

networks:
  app_internal:
    driver: bridge