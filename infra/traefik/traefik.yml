entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: false

certificatesResolvers:
  letsencrypt:
    acme:
      email: ${TLS_EMAIL}
      storage: /acme.json
      httpChallenge:
        entryPoint: web

accessLog: {}
log:
  level: INFO